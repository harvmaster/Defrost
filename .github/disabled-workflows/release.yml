# DISABLED. GitHub only runs workflows in .github/workflows/, so this one never runs.
# Releases are built locally:  NOTARY_PROFILE=defrost-notary scripts/release.sh
#
# To re-enable:  git mv .github/disabled-workflows/release.yml .github/workflows/release.yml
# then add the repository secrets listed below. Before doing so, consider:
#   - a dedicated Developer ID certificate just for CI (revoke it alone if it leaks)
#   - an App Store Connect API key instead of an Apple ID app password
#   - a protected "release" environment that requires approval
#   - pinning actions/checkout to a commit SHA
#
# Builds a signed, notarized DMG when a version tag (e.g. v0.1.0) is pushed,
# and attaches it to a GitHub release.
#
# Repository secrets:
#   DEVELOPER_ID_P12           base64 of a .p12 export of the "Developer ID Application" certificate + key
#   DEVELOPER_ID_P12_PASSWORD  password for that .p12
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_TEAM_ID              Team ID (e.g. G698BP272N)
#   APPLE_APP_PASSWORD         app-specific password for that Apple ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize
        env:
          VERSION: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.dmg --title "Defrost ${{ github.ref_name }}" --generate-notes
